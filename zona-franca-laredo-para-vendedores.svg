<svg xmlns="http://www.w3.org/2000/svg" width="720" height="236" viewBox="0 0 720 236" role="img"><title>Zona franca en Laredo: a quién aplica cada beneficio</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.bg{fill:#ffffff}.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.mut{fill:#eef1f0}.row{fill:#f5f8f7}.pill{fill:#E1F5EE}
.g{fill:#12876A}.g2{fill:#1f9d5f}.rd{fill:#fbe9e7}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl{fill:#22332f}
.tw{fill:#ffffff;font-weight:bold}.tb{fill:#12876A;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
</style><rect class="bg" width="720" height="236"/><rect x="24" y="18" width="672" height="34" rx="6" class="pill"/>
<text x="40" y="40" class="tb" font-size="12">Beneficio</text><text x="300" y="40" class="tb" font-size="12">Aplica cuando</text><text x="520" y="40" class="tb" font-size="12">No aplica cuando</text>
<rect x="24" y="56" width="672" height="34" rx="6" class="row"/>
<text x="40" y="78" class="tl" font-size="12">Diferir arancel de entrada</text><text x="300" y="78" class="ts" font-size="12">importas de tercer país</text><text x="520" y="78" class="ts" font-size="12">origen estadounidense</text>
<rect x="24" y="94" width="672" height="34" rx="6" class="mut"/>
<text x="40" y="116" class="tl" font-size="12">Eliminarlo al reexportar</text><text x="300" y="116" class="ts" font-size="12">toda la carga va a México</text><text x="520" y="116" class="ts" font-size="12">también vendes en EEUU</text>
<rect x="24" y="132" width="672" height="34" rx="6" class="row"/>
<text x="40" y="154" class="tl" font-size="12">Consolidar y dividir</text><text x="300" y="154" class="ts" font-size="12">recibes contenedor completo</text><text x="520" y="154" class="ts" font-size="12">envíos pequeños frecuentes</text>
<rect x="24" y="170" width="672" height="34" rx="6" class="mut"/>
<text x="40" y="192" class="tl" font-size="12">Manipular antes del cruce</text><text x="300" y="192" class="ts" font-size="12">requiere etiquetado o kits</text><text x="520" y="192" class="ts" font-size="12">producto listo para vender</text>
<text x="24" y="226" class="tl" font-size="13">La columna derecha evita decisiones equivocadas: un beneficio que no aplica no cambia tu costo.</text></svg>