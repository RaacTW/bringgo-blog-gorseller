<svg xmlns="http://www.w3.org/2000/svg" width="720" height="232" viewBox="0 0 720 232" role="img"><title>IMMEX akışı: giren malzeme nereye gidiyor</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.bg{fill:#ffffff}.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.mut{fill:#eef1f0}.row{fill:#f5f8f7}.pill{fill:#E1F5EE}
.g{fill:#12876A}.g2{fill:#1f9d5f}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl{fill:#22332f}
.tw{fill:#ffffff;font-weight:bold}.tb{fill:#12876A;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
</style><rect class="bg" width="720" height="232"/><rect x="24" y="66" width="152" height="58" rx="8" class="card"/>
<text x="100" y="90" class="tt" font-size="13" text-anchor="middle">Geçici giriş</text>
<text x="100" y="109" class="ts" font-size="11" text-anchor="middle">vergi ertelenir</text>
<line x1="176" y1="95" x2="236" y2="95" class="ln"/>

<rect x="244" y="66" width="152" height="58" rx="8" class="card"/>
<text x="320" y="90" class="tt" font-size="13" text-anchor="middle">Üretim</text>
<text x="320" y="109" class="ts" font-size="11" text-anchor="middle">parti bazlı kayıt</text>

<line x1="396" y1="95" x2="428" y2="95" class="ln"/>
<line x1="428" y1="36" x2="428" y2="158" class="ln"/>
<line x1="428" y1="36" x2="460" y2="36" class="ln"/>
<line x1="428" y1="95" x2="460" y2="95" class="ln"/>
<line x1="428" y1="158" x2="460" y2="158" class="ln"/>

<rect x="460" y="14" width="236" height="44" rx="8" class="g"/>
<text x="578" y="34" class="tw" font-size="13" text-anchor="middle">Yeniden ihracat</text>
<text x="578" y="50" fill="#d9f2e7" font-size="11" text-anchor="middle">vergi hiç doğmaz</text>

<rect x="460" y="73" width="236" height="44" rx="8" class="g2"/>
<text x="578" y="93" class="tw" font-size="13" text-anchor="middle">Fire</text>
<text x="578" y="109" fill="#e6f7ee" font-size="11" text-anchor="middle">sınır içinde vergi doğmaz</text>

<rect x="460" y="136" width="236" height="44" rx="8" class="row"/>
<text x="578" y="156" class="tt" font-size="13" text-anchor="middle">İç pazara satış</text>
<text x="578" y="172" class="ts" font-size="11" text-anchor="middle">ertelenen vergi doğar</text>

<text x="24" y="214" class="tl" font-size="13">Denetimde sorulan tek şey şudur: giren her parti bu üç yoldan hangisine, ne kadar gitti.</text></svg>