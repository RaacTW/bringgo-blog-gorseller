text class="td" x="476" y="257" font-size="12">Gizlilik seçeneği var</text><line class="ln" x1="22" y1="272" x2="698" y2="272"/><rect class="row" x="22" y="272" width="676" height="34"/><text class="td" x="32" y="291" font-size="12">5 İthalatçı</text><text class="td" x="257" y="291" font-size="12">Ad, adres, iletişim</text><text class="td" x="476" y="291" font-size="12">Biliniyorsa</text><line class="ln" x1="22" y1="306" x2="698" y2="306"/><rect class="row2" x="22" y="306" width="676" height="34"/><text class="td" x="32" y="325" font-size="12">6 Ürün ve kod</text><text class="td" x="257" y="325" font-size="12">Tanım ve 6 haneli tarife kodu</text><text class="td" x="476" y="325" font-size="12">Her beyanda</text><line class="ln" x1="22" y1="340" x2="698" y2="340"/><rect class="row" x="22" y="340" width="676" height="34"/><text class="td" x="32" y="359" font-size="12">7 Menşe kriteri</text><text class="td" x="257" y="359" font-size="12">Madde 4.2'deki hangi ölçüt</text><text class="td" x="476" y="359" font-size="12">Her beyanda</text><line class="ln" x1="22" y1="374" x2="698" y2="374"/><rect class="row2" x="22" y="374" width="676" height="34"/><text class="td" x="32" y="393" font-size="12">8 Dönem</text><text class="td" x="257" y="393" font-size="12">En fazla 12 ay</text><text class="td" x="476" y="393" font-size="12">Sadece dönemsel beyanda</text><line class="ln" x1="22" y1="408" x2="698" y2="408"/><rect class="row" x="22" y="408" width="676" height="34"/><text class="td" x="32" y="427" font-size="12">9 İmza ve tarih</text><text class="td" x="257" y="427" font-size="12">Yetkili imza ve taahhüt metni</text><text class="td" x="476" y="427" font-size="12">Her beyanda</text><line class="ln" x1="22" y1="442" x2="698" y2="442"/><text class="ts" x="28" y="464" font-size="10">BringGo Ship · bringgoship.com</text></svg>