<text class="tt" x="28" y="70" font-size="19">Cuatro Tipos De Operador Transfronterizo</text>
<rect class="card" x="22" y="82" width="676" height="178" rx="10"/>
<rect class="hdr" x="22" y="82" width="676" height="42" rx="10"/>
<rect class="hdr" x="22" y="104" width="676" height="20"/>
<text class="th" x="32" y="104" font-size="12">Tipo</text>
<text class="th" x="264" y="104" font-size="12">Es dueño de</text>
<text class="th" x="496" y="104" font-size="12">Ideal para</text>
<rect class="row" x="22" y="124" width="676" height="34"/>
<text class="tdb" x="32" y="145" font-size="12">Gran agente de carga</text>
<text class="td" x="264" y="145" font-size="12">Línea y escala</text>
<text class="td" x="496" y="145" font-size="12">Volumen empresarial</text>
