<svg xmlns="http://www.w3.org/2000/svg" width="720" height="232" viewBox="0 0 720 232" role="img"><title>What a freight forwarder does and does not do</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.bg{fill:#ffffff}.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.mut{fill:#eef1f0}.row{fill:#f5f8f7}.pill{fill:#E1F5EE}
.g{fill:#12876A}.g2{fill:#1f9d5f}.rd{fill:#fbe9e7}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl{fill:#22332f}
.tw{fill:#ffffff;font-weight:bold}.tb{fill:#12876A;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
</style><rect class="bg" width="720" height="232"/><rect x="24" y="20" width="330" height="150" rx="8" class="g"/>
<text x="189" y="46" class="tw" font-size="14" text-anchor="middle">Does</text>
<text x="42" y="72" fill="#e6f7ee" font-size="12">Selects route, mode and crossing</text>
<text x="42" y="94" fill="#e6f7ee" font-size="12">Sources and manages carriers</text>
<text x="42" y="116" fill="#e6f7ee" font-size="12">Assembles and checks documents</text>
<text x="42" y="138" fill="#e6f7ee" font-size="12">Coordinates with the broker</text>
<text x="42" y="160" fill="#e6f7ee" font-size="12">Surfaces problems with an option</text>
<rect x="366" y="20" width="330" height="150" rx="8" class="card"/>
<text x="531" y="46" class="tt" font-size="14" text-anchor="middle">Does not</text>
<text x="384" y="72" class="ts" font-size="12">File the declaration in its own name</text>
<text x="384" y="94" class="ts" font-size="12">Guarantee your product complies</text>
<text x="384" y="116" class="ts" font-size="12">Determine tariff classification for you</text>
<text x="384" y="138" class="ts" font-size="12">Eliminate duty or tax</text>
<text x="384" y="160" class="ts" font-size="12">Control the crossing's throughput</text>
<text x="24" y="204" class="tl" font-size="13">The single behavior that separates good from adequate: problems are raised before the shipment moves.</text></svg>