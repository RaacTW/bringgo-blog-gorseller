<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" role="img"><title>How IVA is calculated and when it is recoverable</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.bg{fill:#ffffff}.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.mut{fill:#eef1f0}.row{fill:#f5f8f7}.pill{fill:#E1F5EE}
.g{fill:#12876A}.g2{fill:#1f9d5f}.rd{fill:#fbe9e7}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl{fill:#22332f}
.tw{fill:#ffffff;font-weight:bold}.tb{fill:#12876A;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
</style><rect class="bg" width="720" height="252"/><text x="24" y="34" class="tt" font-size="14">Order of calculation</text>
<rect x="24" y="46" width="300" height="30" rx="6" class="row"/><text x="40" y="66" class="tl" font-size="12">1. Customs value</text>
<rect x="24" y="80" width="300" height="30" rx="6" class="row"/><text x="40" y="100" class="tl" font-size="12">2. Add duty</text>
<rect x="24" y="114" width="300" height="30" rx="6" class="row"/><text x="40" y="134" class="tl" font-size="12">3. Add other entry charges</text>
<rect x="24" y="148" width="300" height="30" rx="6" class="g"/><text x="40" y="168" class="tw" font-size="12">4. IVA on that combined figure</text>
<text x="368" y="34" class="tt" font-size="14">Recoverable to you?</text>
<rect x="368" y="46" width="328" height="30" rx="6" class="g"/><text x="384" y="66" class="tw" font-size="12">You are the importer of record</text>
<rect x="368" y="80" width="328" height="30" rx="6" class="row"/><text x="384" y="100" class="tl" font-size="12">Goods used in exempt activity</text>
<rect x="368" y="114" width="328" height="30" rx="6" class="rd"/><text x="384" y="134" class="tl" font-size="12">Cleared under someone else's registration</text>
<rect x="368" y="148" width="328" height="30" rx="6" class="rd"/><text x="384" y="168" class="tl" font-size="12">No Mexican registration at all</text>
<text x="24" y="206" class="tl" font-size="13">IVA applies to a base that already includes duty, so a wrong tariff code inflates two lines, not one.</text>
<text x="24" y="230" class="ts" font-size="12">If it is creditable to you it belongs in working capital, not unit cost. If it is not, it belongs in unit cost in full.</text></svg>