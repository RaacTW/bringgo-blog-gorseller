<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img"><title>La pila de costos de importar a Mexico</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.row{fill:#f5f8f7}.pill{fill:#E1F5EE}.mut{fill:#eef1f0}
.acc{fill:#12876A}.rd{fill:#fbe9e7}.am{fill:#fbf1dd}.tl{fill:#E1F5EE}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl2{fill:#22332f}
.tv{fill:#0F6E56;font-weight:bold}.tw{fill:#ffffff;font-weight:bold}
.tf{fill:#8a9691}.big{fill:#0F3D33;font-weight:bold}
.trd{fill:#a3392c;font-weight:bold}.tam{fill:#8a5a12;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
@media (prefers-color-scheme:dark){
.card{fill:#16211e;stroke:#2c3a35}
.row{fill:#1d2b27}.pill{fill:#123a2e}.mut{fill:#28352f}
.acc{fill:#2fae7e}.rd{fill:#3a201c}.am{fill:#352a15}.tl{fill:#123a2e}
.tt{fill:#d7f2e6}.ts{fill:#8fa79d}.tl2{fill:#cfe0d9}
.tv{fill:#6fe0b0}.tw{fill:#ffffff}
.tf{fill:#6d8279}.big{fill:#d7f2e6}
.trd{fill:#f0a99e}.tam{fill:#e6c281}.ln{stroke:#31423c}}
</style>
<rect x="1" y="1" width="718" height="428" rx="18" class="card"/>
<rect x="28" y="26" width="4" height="30" rx="2" class="acc"/>
<text x="44" y="40" font-size="19" class="tt">Importar no es un solo costo</text>
<text x="44" y="60" font-size="13" class="ts">La pila completa, de la base al costo real</text>

<text x="44" y="90" font-size="11" class="tf">= COSTO REAL</text>
<rect x="44" y="100" width="300" height="44" rx="7" class="am"/>
<text x="60" y="121" font-size="12" class="tam">Logística</text>
<text x="60" y="137" font-size="11" class="ts">maniobras, almacenaje, prevalidación</text>

<rect x="44" y="150" width="300" height="44" rx="7" class="tl"/>
<text x="60" y="171" font-size="12" class="tv">Servicios aduanales</text>
<text x="60" y="187" font-size="11" class="tl2">honorarios del agente aduanal</text>

<rect x="44" y="200" width="300" height="58" rx="7" class="pill"/>
<text x="60" y="221" font-size="12" class="tv">Impuestos</text>
<text x="60" y="237" font-size="11" class="tl2">IGI 0 a 25% · IVA 16% · DTA 8 al millar</text>
<text x="60" y="252" font-size="10" class="ts">el IVA va sobre valor + IGI + DTA</text>

<rect x="44" y="264" width="300" height="44" rx="7" class="mut"/>
<text x="60" y="285" font-size="12" class="tt">Valor en aduana</text>
<text x="60" y="301" font-size="11" class="ts">mercancía + flete + seguro</text>
<text x="44" y="326" font-size="11" class="tf">Base de todo el cálculo</text>

<line x1="376" y1="96" x2="376" y2="330" class="ln"/>

<text x="400" y="106" font-size="13" class="tt">Lo que mueve el número final</text>
<circle cx="408" cy="136" r="4" class="acc"/>
<text x="422" y="140" font-size="12" class="tl2">Arancel cero con T-MEC no elimina</text>
<text x="422" y="156" font-size="12" class="ts">IVA, DTA ni honorarios.</text>

<circle cx="408" cy="184" r="4" class="acc"/>
<text x="422" y="188" font-size="12" class="tl2">El almacenaje se cobra por día:</text>
<text x="422" y="204" font-size="12" class="ts">un pedimento detenido se encarece.</text>

<circle cx="408" cy="232" r="4" class="acc"/>
<text x="422" y="236" font-size="12" class="tl2">De minimis por tramos, origen</text>
<text x="422" y="252" font-size="12" class="ts">EEUU o Canadá: 50 libre, 50 a 117 solo IVA.</text>

<circle cx="408" cy="280" r="4" class="acc"/>
<text x="422" y="284" font-size="12" class="tl2">IVA 8% en franja fronteriza,</text>
<text x="422" y="300" font-size="12" class="ts">pero no es automático.</text>

<rect x="44" y="344" width="632" height="34" rx="8" class="pill"/>
<text x="60" y="365" font-size="12" class="tv">Costo real = la suma de la pila, no solo el arancel</text>

<text x="44" y="400" font-size="11" class="tf">Marco vigente en agosto de 2026. Confirme la fracción arancelaria antes de importar.</text>
<text x="44" y="416" font-size="10" class="tf">BringGo Ship · logística transfronteriza EEUU-México</text>
</svg>
