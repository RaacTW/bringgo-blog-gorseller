<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img"><title>One HS code decides four things at Mexican customs</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.row{fill:#f5f8f7}.pill{fill:#E1F5EE}.mut{fill:#eef1f0}
.acc{fill:#12876A}.rd{fill:#fbe9e7}.am{fill:#fbf1dd}.tl{fill:#E1F5EE}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl2{fill:#22332f}
.tv{fill:#0F6E56;font-weight:bold}.tw{fill:#ffffff;font-weight:bold}
.tf{fill:#8a9691}.big{fill:#0F3D33;font-weight:bold}
.trd{fill:#a3392c;font-weight:bold}.tam{fill:#8a5a12;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
@media (prefers-color-scheme:dark){
.card{fill:#16211e;stroke:#2c3a35}
.row{fill:#1d2b27}.pill{fill:#123a2e}.mut{fill:#28352f}
.acc{fill:#2fae7e}.rd{fill:#3a201c}.am{fill:#352a15}.tl{fill:#123a2e}
.tt{fill:#d7f2e6}.ts{fill:#8fa79d}.tl2{fill:#cfe0d9}
.tv{fill:#6fe0b0}.tw{fill:#ffffff}
.tf{fill:#6d8279}.big{fill:#d7f2e6}
.trd{fill:#f0a99e}.tam{fill:#e6c281}.ln{stroke:#31423c}}
</style>
<rect x="1" y="1" width="718" height="422" rx="18" class="card"/>
<rect x="28" y="26" width="4" height="30" rx="2" class="acc"/>
<text x="44" y="40" font-size="19" class="tt">One code decides four things</text>
<text x="44" y="60" font-size="13" class="ts">A wrong HS code is not just a wrong duty rate</text>

<rect x="44" y="90" width="176" height="112" rx="10" class="pill"/>
<text x="132" y="128" font-size="13" class="tv" text-anchor="middle">HS TARIFF CODE</text>
<text x="132" y="150" font-size="11" class="tl2" text-anchor="middle">declared on the</text>
<text x="132" y="166" font-size="11" class="tl2" text-anchor="middle">pedimento</text>
<text x="132" y="188" font-size="11" class="tf" text-anchor="middle">one field, four outcomes</text>

<line x1="220" y1="146" x2="268" y2="146" class="ln"/>
<line x1="268" y1="112" x2="268" y2="336" class="ln"/>

<rect x="284" y="90" width="392" height="46" rx="8" class="row"/>
<text x="300" y="110" font-size="12" class="tt">1 · Duty rate</text>
<text x="300" y="128" font-size="11" class="ts">IGI 0 to 25 percent, and the base for any penalty</text>
<line x1="268" y1="113" x2="284" y2="113" class="ln"/>

<rect x="284" y="146" width="392" height="46" rx="8" class="row"/>
<text x="300" y="166" font-size="12" class="tt">2 · Prior permit or sanitary authorization</text>
<text x="300" y="184" font-size="11" class="ts">COFEPRIS, SENASICA, SEDENA, SENER by product</text>
<line x1="268" y1="169" x2="284" y2="169" class="ln"/>

<rect x="284" y="202" width="392" height="46" rx="8" class="row"/>
<text x="300" y="222" font-size="12" class="tt">3 · Sector registry (Padron Sectorial)</text>
<text x="300" y="240" font-size="11" class="ts">textiles, steel, chemicals, electronics, auto parts</text>
<line x1="268" y1="225" x2="284" y2="225" class="ln"/>

<rect x="284" y="258" width="392" height="46" rx="8" class="row"/>
<text x="300" y="278" font-size="12" class="tt">4 · NOM standards</text>
<text x="300" y="296" font-size="11" class="ts">labeling and safety, separate from the permit</text>
<line x1="268" y1="281" x2="284" y2="281" class="ln"/>

<rect x="44" y="322" width="632" height="44" rx="8" class="rd"/>
<text x="60" y="342" font-size="12" class="trd">Penalty for misclassification: 250 to 300 percent of the import duty involved</text>
<text x="60" y="358" font-size="11" class="ts">Since 1 January 2026 the importer of record carries this liability directly</text>

<text x="44" y="392" font-size="11" class="tf">Source: Mexico customs law as reformed 19 November 2025, in force 1 January 2026.</text>
<text x="44" y="408" font-size="10" class="tf">BringGo Ship · US to Mexico cross border logistics</text>
</svg>
