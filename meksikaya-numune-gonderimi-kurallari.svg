<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img"><title>Meksika numune mi ticari gonderi mi karar testi</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.row{fill:#f5f8f7}.pill{fill:#E1F5EE}.mut{fill:#eef1f0}
.acc{fill:#12876A}.rd{fill:#fbe9e7}.am{fill:#fbf1dd}.tl{fill:#E1F5EE}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl2{fill:#22332f}
.tv{fill:#0F6E56;font-weight:bold}.tw{fill:#ffffff;font-weight:bold}
.tf{fill:#8a9691}.big{fill:#0F3D33;font-weight:bold}
.trd{fill:#a3392c;font-weight:bold}.tam{fill:#8a5a12;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
@media (prefers-color-scheme:dark){
.card{fill:#16211e;stroke:#2c3a35}
.row{fill:#1d2b27}.pill{fill:#123a2e}.mut{fill:#28352f}
.acc{fill:#2fae7e}.rd{fill:#3a201c}.am{fill:#352a15}.tl{fill:#123a2e}
.tt{fill:#d7f2e6}.ts{fill:#8fa79d}.tl2{fill:#cfe0d9}
.tv{fill:#6fe0b0}.tw{fill:#ffffff}
.tf{fill:#6d8279}.big{fill:#d7f2e6}
.trd{fill:#f0a99e}.tam{fill:#e6c281}.ln{stroke:#31423c}}
</style>
<rect x="1" y="1" width="718" height="438" rx="18" class="card"/>
<rect x="28" y="26" width="4" height="30" rx="2" class="acc"/>
<text x="44" y="40" font-size="19" class="tt">Numune mi, ticari gönderi mi</text>
<text x="44" y="60" font-size="13" class="ts">Kararı kutunun etiketi değil, ürünün fiziksel durumu verir</text>

<rect x="44" y="88" width="632" height="42" rx="8" class="mut"/>
<text x="360" y="114" font-size="13" class="tt" text-anchor="middle">Ürün satılabilir durumda mı?</text>

<line x1="200" y1="130" x2="200" y2="158" class="ln"/>
<line x1="520" y1="130" x2="520" y2="158" class="ln"/>
<text x="200" y="150" font-size="11" class="trd" text-anchor="middle">EVET</text>
<text x="520" y="150" font-size="11" class="tv" text-anchor="middle">HAYIR, ve dört şart sağlanıyor</text>

<rect x="44" y="158" width="300" height="150" rx="10" class="rd"/>
<text x="60" y="182" font-size="13" class="trd">TİCARİ GÖNDERİ</text>
<text x="60" y="204" font-size="11" class="tl2">Bedelsiz olsa da, faturası sıfır olsa da.</text>
<text x="60" y="226" font-size="11" class="tl2">Gerekenler:</text>
<text x="60" y="246" font-size="11" class="ts">RFC ve Padrón kayıtlı ithalatçı</text>
<text x="60" y="264" font-size="11" class="ts">Pedimento ve beyan</text>
<text x="60" y="282" font-size="11" class="ts">Gümrük vergisi + IVA + DTA</text>
<text x="60" y="300" font-size="11" class="ts">Ürün grubuna göre NOM</text>

<rect x="376" y="158" width="300" height="150" rx="10" class="tl"/>
<text x="392" y="182" font-size="13" class="tv">NUMUNE</text>
<text x="392" y="204" font-size="11" class="tl2">Gümrük kıymeti doğmaz, vergi ödenmez.</text>
<text x="392" y="226" font-size="11" class="tl2">Dört şart:</text>
<text x="392" y="246" font-size="11" class="ts">Kesilmiş, delinmiş ya da kalıcı işaretli</text>
<text x="392" y="264" font-size="11" class="ts">Birim değer bir doları geçmiyor</text>
<text x="392" y="282" font-size="11" class="ts">Miktar sadece tanıtımlık</text>
<text x="392" y="300" font-size="11" class="ts">Ticari ambalajda değil</text>

<rect x="44" y="324" width="632" height="40" rx="8" class="am"/>
<text x="60" y="341" font-size="12" class="tam">Numune muamelesi göremeyen grup: toz, sıvı, tablet ve ilaç niteliğindeki maddeler</text>
<text x="60" y="357" font-size="11" class="ts">Bileşimi ancak analizle belirlenebilen ürün numune sınıfında değerlendirilmez</text>

<rect x="44" y="372" width="632" height="34" rx="8" class="pill"/>
<text x="60" y="393" font-size="12" class="tv">Türk satıcı notu: 50 dolar muafiyeti Türkiye menşeli üründe işlemez, o kademe ABD ve Kanada menşeine aittir</text>

<text x="44" y="428" font-size="10" class="tf">19 Ağustos 2026 itibarıyla geçerli. BringGo Ship · ABD-Meksika sınır ötesi lojistik</text>
</svg>
