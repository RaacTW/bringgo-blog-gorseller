<text class="tdb" x="450" y="179" font-size="12">Local parcel rate</text>
<line class="ln" x1="22" y1="192" x2="698" y2="192"/>
<rect class="row" x="22" y="192" width="676" height="34"/>
<text class="td" x="32" y="213" font-size="12">Speed</text>
