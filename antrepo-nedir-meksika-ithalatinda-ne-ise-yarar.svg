<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img"><title>Verginin ne zaman ödendiği: doğrudan ithalat ve antrepo</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.bg{fill:#ffffff}.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.mut{fill:#eef1f0}.row{fill:#f5f8f7}.pill{fill:#E1F5EE}
.g{fill:#12876A}.g2{fill:#1f9d5f}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl{fill:#22332f}
.tw{fill:#ffffff;font-weight:bold}.tb{fill:#12876A;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
</style><rect class="bg" width="720" height="290"/><text x="24" y="34" class="tt" font-size="15">Doğrudan ithalat</text>
<rect x="24" y="46" width="150" height="46" rx="6" class="g"/>
<text x="99" y="75" class="tw" font-size="14" text-anchor="middle">%100</text>
<rect x="182" y="46" width="150" height="46" rx="6" class="mut"/>
<rect x="340" y="46" width="150" height="46" rx="6" class="mut"/>
<rect x="498" y="46" width="150" height="46" rx="6" class="mut"/>
<text x="662" y="75" class="ts" font-size="12">toplam</text>

<text x="24" y="140" class="tt" font-size="15">Antrepo, aylık çekiş</text>
<rect x="24" y="152" width="150" height="46" rx="6" class="g"/>
<text x="99" y="181" class="tw" font-size="14" text-anchor="middle">%25</text>
<rect x="182" y="152" width="150" height="46" rx="6" class="g"/>
<text x="257" y="181" class="tw" font-size="14" text-anchor="middle">%25</text>
<rect x="340" y="152" width="150" height="46" rx="6" class="g"/>
<text x="415" y="181" class="tw" font-size="14" text-anchor="middle">%25</text>
<rect x="498" y="152" width="150" height="46" rx="6" class="g"/>
<text x="573" y="181" class="tw" font-size="14" text-anchor="middle">%25</text>
<text x="662" y="181" class="ts" font-size="12">toplam</text>

<line x1="24" y1="222" x2="648" y2="222" class="ln"/>
<text x="99" y="242" class="ts" font-size="12" text-anchor="middle">1. ay</text>
<text x="257" y="242" class="ts" font-size="12" text-anchor="middle">2. ay</text>
<text x="415" y="242" class="ts" font-size="12" text-anchor="middle">3. ay</text>
<text x="573" y="242" class="ts" font-size="12" text-anchor="middle">4. ay</text>
<text x="24" y="272" class="tl" font-size="13">Ödenen toplam vergi iki senaryoda da aynıdır. Değişen tek şey paranın ne zaman çıktığıdır.</text></svg>