.bg{fill:#0d1614}.card{fill:#16211e;stroke:#2c3a35}
.hdr{fill:#12876A}.row{fill:#1d2b27}.row2{fill:#16211e}.ln{stroke:#2c3a35}
.tt{fill:#d7f2e6}.ts{fill:#8fa79d}
.th{fill:#ffffff}.td{fill:#cfe0d9}.tdb{fill:#6fe0b0}
.pill{fill:#123a2e}.tp{fill:#6fe0b0}}
</style>
<rect class="bg" width="720" height="334"/>
<rect class="pill" x="28" y="20" width="194" height="24" rx="12"/>
<text class="tp" x="41" y="36" font-size="12">Warehousing &amp; Fulfillment</text>
<text class="tt" x="28" y="70" font-size="19">What A Receiving Exception Actually Costs</text>
<rect class="card" x="22" y="82" width="676" height="212" rx="10"/>
<rect class="hdr" x="22" y="82" width="676" height="42" rx="10"/>
<rect class="hdr" x="22" y="104" width="676" height="20"/>
<text class="th" x="32" y="104" font-size="12">Failure</text>
<text class="th" x="236" y="104" font-size="12">Days lost</text>
<text class="th" x="334" y="104" font-size="12">Units affected</text>
<text class="th" x="458" y="104" font-size="12">Direct cost</text>
<rect class="row" x="22" y="124" width="676" height="34"/>
<text class="td" x="32" y="145" font-size="12">No appointment</text>
<text class="tdb" x="236" y="145" font-size="12">1 to 2</text>
<text class="td" x="334" y="145" font-size="12">13 to 26</text>
<text class="td" x="458" y="145" font-size="12">Detention plus redelivery</text>
<line class="ln" x1="22" y1="158" x2="698" y2="158"/>
<rect class="row2" x="22" y="158" width="676" height="34"/>
<text class="td" x="32" y="179" font-size="12">No ASN</text>
<text class="tdb" x="236" y="179" font-size="12">1</text>
<text class="td" x="334" y="179" font-size="12">13</text>
<text class="td" x="458" y="179" font-size="12">3 to 4 times unload labor</text>
<line class="ln" x1="22" y1="192" x2="698" y2="192"/>
<rect class="row" x="22" y="192" width="676" height="34"/>
<text class="td" x="32" y="213" font-size="12">Label wrong, file exists</text>
<text class="tdb" x="236" y="213" font-size="12">0 to 1</text>
<text class="td" x="334" y="213" font-size="12">0 to 13</text>
<text class="td" x="458" y="213" font-size="12">Rework, 1 hour per 100</text>
<line class="ln" x1="22" y1="226" x2="698" y2="226"/>
<rect class="row2" x="22" y="226" width="676" height="34"/>
<text class="td" x="32" y="247" font-size="12">Label wrong, no file</text>
<text class="tdb" x="236" y="247" font-size="12">Indefinite</text>
<text class="td" x="334" y="247" font-size="12">All 500</text>
<text class="td" x="458" y="247" font-size="12">Stock held, capital frozen</text>
<line class="ln" x1="22" y1="260" x2="698" y2="260"/>
<rect class="row" x="22" y="260" width="676" height="34"/>
<text class="td" x="32" y="281" font-size="12">Count differs from entry</text>
<text class="tdb" x="236" y="281" font-size="12">2 to 5</text>
<text class="td" x="334" y="281" font-size="12">26 to 65</text>
<text class="td" x="458" y="281" font-size="12">Reconciliation, amendment</text>
<text class="ts" x="28" y="320" font-size="10">BringGo Ship · bringgoship.com</text>
</svg>