<svg xmlns="http://www.w3.org/2000/svg" width="720" height="246" viewBox="0 0 720 246" role="img"><title>Qué permite hacer un recinto fiscalizado estratégico</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.bg{fill:#ffffff}.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.mut{fill:#eef1f0}.row{fill:#f5f8f7}.pill{fill:#E1F5EE}
.g{fill:#12876A}.g2{fill:#1f9d5f}.rd{fill:#fbe9e7}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl{fill:#22332f}
.tw{fill:#ffffff;font-weight:bold}.tb{fill:#12876A;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
</style><rect class="bg" width="720" height="246"/><rect x="24" y="20" width="212" height="150" rx="8" class="card"/>
<text x="130" y="46" class="tt" font-size="14" text-anchor="middle">Dentro del área</text>
<text x="40" y="72" class="tl" font-size="12">Almacenar sin causar</text><text x="40" y="88" class="tl" font-size="12">impuestos</text>
<text x="40" y="112" class="tl" font-size="12">Etiquetar y reempacar</text>
<text x="40" y="136" class="tl" font-size="12">Control de calidad</text><text x="40" y="152" class="tl" font-size="12">y selección</text>
<rect x="254" y="20" width="212" height="150" rx="8" class="card"/>
<text x="360" y="46" class="tt" font-size="14" text-anchor="middle">Transformación</text>
<text x="270" y="72" class="tl" font-size="12">Ensamble dentro del</text><text x="270" y="88" class="tl" font-size="12">alcance autorizado</text>
<text x="270" y="112" class="tl" font-size="12">Consolidar orígenes</text><text x="270" y="128" class="tl" font-size="12">distintos</text>
<text x="270" y="152" class="tl" font-size="12">Registro por lote</text>
<rect x="484" y="20" width="212" height="150" rx="8" class="g"/>
<text x="590" y="46" class="tw" font-size="14" text-anchor="middle">A la salida</text>
<text x="500" y="72" fill="#e6f7ee" font-size="12">Salidas parciales</text>
<text x="500" y="96" fill="#e6f7ee" font-size="12">Impuesto solo por lo</text><text x="500" y="112" fill="#e6f7ee" font-size="12">que sale</text>
<text x="500" y="136" fill="#e6f7ee" font-size="12">Retorno sin causar</text><text x="500" y="152" fill="#e6f7ee" font-size="12">impuesto</text>
<text x="24" y="206" class="tl" font-size="13">Las tres columnas se sostienen sobre un solo requisito: inventario rastreable a nivel de lote.</text>
<text x="24" y="228" class="ts" font-size="12">Sin ese registro, el régimen no se puede defender en una revisión.</text></svg>