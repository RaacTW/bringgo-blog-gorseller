.tt{fill:#d7f2e6}.ts{fill:#8fa79d}
.th{fill:#ffffff}.td{fill:#cfe0d9}.tdb{fill:#6fe0b0}
.pill{fill:#123a2e}.tp{fill:#6fe0b0}}
</style>
<rect class="bg" width="720" height="300"/>
<rect class="pill" x="28" y="20" width="207" height="24" rx="12"/>
<text class="tp" x="41" y="36" font-size="12">Returns &amp; Reverse Logistics</text>
<text class="tt" x="28" y="70" font-size="19">Customs Impact By How You Handle The Return</text>
<rect class="card" x="22" y="82" width="676" height="178" rx="10"/>
<rect class="hdr" x="22" y="82" width="676" height="42" rx="10"/>
<rect class="hdr" x="22" y="104" width="676" height="20"/>
<text class="th" x="32" y="104" font-size="12">Approach</text>
<text class="th" x="262" y="104" font-size="12">Declaration needed?</text>
<text class="th" x="476" y="104" font-size="12">Cost</text>
<rect class="row" x="22" y="124" width="676" height="34"/>
<text class="tdb" x="32" y="145" font-size="12">Send each back to the US</text>
<text class="td" x="262" y="145" font-size="12">Re-export and re-import</text>
<text class="td" x="476" y="145" font-size="12">High, more than the item</text>
<line class="ln" x1="22" y1="158" x2="698" y2="158"/>
<rect class="row2" x="22" y="158" width="676" height="34"/>
<text class="tdb" x="32" y="179" font-size="12">Handle it inside Mexico</text>
<text class="td" x="262" y="179" font-size="12">None, stays in country</text>
<text class="td" x="476" y="179" font-size="12">Low, local restock</text>
<line class="ln" x1="22" y1="192" x2="698" y2="192"/>
<rect class="row" x="22" y="192" width="676" height="34"/>
<text class="tdb" x="32" y="213" font-size="12">Consolidate the exceptions</text>
<text class="td" x="262" y="213" font-size="12">Once for the batch</text>
<text class="td" x="476" y="213" font-size="12">Spread across units</text>
<line class="ln" x1="22" y1="226" x2="698" y2="226"/>
<rect class="row2" x="22" y="226" width="676" height="34"/>
<text class="tdb" x="32" y="247" font-size="12">US-origin back to the US</text>
