<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img"><title>Costo por pedido: cómo se reparte cada componente</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.bg{fill:#ffffff}.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.mut{fill:#eef1f0}.row{fill:#f5f8f7}.pill{fill:#E1F5EE}
.g{fill:#12876A}.g2{fill:#1f9d5f}.rd{fill:#fbe9e7}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl{fill:#22332f}
.tw{fill:#ffffff;font-weight:bold}.tb{fill:#12876A;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
</style><rect class="bg" width="720" height="250"/><rect x="24" y="18" width="672" height="34" rx="6" class="pill"/>
<text x="40" y="40" class="tb" font-size="12">Componente</text><text x="300" y="40" class="tb" font-size="12">Se reparte entre</text><text x="530" y="40" class="tb" font-size="12">Lo mejora</text>
<rect x="24" y="56" width="672" height="32" rx="6" class="row"/>
<text x="40" y="77" class="tl" font-size="12">Almacenaje</text><text x="300" y="77" class="ts" font-size="12">pedidos del mes</text><text x="530" y="77" class="ts" font-size="12">mayor rotación</text>
<rect x="24" y="92" width="672" height="32" rx="6" class="mut"/>
<text x="40" y="113" class="tl" font-size="12">Manejo</text><text x="300" y="113" class="ts" font-size="12">por pedido</text><text x="530" y="113" class="ts" font-size="12">empaque estándar</text>
<rect x="24" y="128" width="672" height="32" rx="6" class="g"/>
<text x="40" y="149" class="tw" font-size="12">Cruce</text><text x="300" y="149" fill="#d9f2e7" font-size="12">pedidos del mismo cruce</text><text x="530" y="149" fill="#d9f2e7" font-size="12">más pedidos por cruce</text>
<rect x="24" y="164" width="672" height="32" rx="6" class="mut"/>
<text x="40" y="185" class="tl" font-size="12">Impuestos y derechos</text><text x="300" y="185" class="ts" font-size="12">por pedido</text><text x="530" y="185" class="ts" font-size="12">clasificación correcta</text>
<rect x="24" y="200" width="672" height="32" rx="6" class="row"/>
<text x="40" y="221" class="tl" font-size="12">Última milla</text><text x="300" y="221" class="ts" font-size="12">por pedido</text><text x="530" y="221" class="ts" font-size="12">concentración geográfica</text>
<text x="24" y="246" class="ts" font-size="12">La fila verde es la que más mueve el resultado y mejora sola conforme crece el volumen.</text></svg>