<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img"><title>Six Checks To Resolve Before Apparel Ships</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.bg{fill:#ffffff}.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.hdr{fill:#0F6E56}.row{fill:#f5f8f7}.row2{fill:#ffffff}.ln{stroke:#dbe6e1;stroke-width:1}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}
.th{fill:#ffffff;font-weight:bold}.td{fill:#22332f}.tdb{fill:#0F6E56;font-weight:bold}
.pill{fill:#E1F5EE}.tp{fill:#0F6E56;font-weight:bold}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1614}.card{fill:#16211e;stroke:#2c3a35}
.hdr{fill:#12876A}.row{fill:#1d2b27}.row2{fill:#16211e}.ln{stroke:#2c3a35}
.tt{fill:#d7f2e6}.ts{fill:#8fa79d}
.th{fill:#ffffff}.td{fill:#cfe0d9}.tdb{fill:#6fe0b0}
.pill{fill:#123a2e}.tp{fill:#6fe0b0}}
</style>
<rect class="bg" width="720" height="368"/>
<rect class="pill" x="28" y="20" width="133" height="24" rx="12"/>
<text class="tp" x="41" y="36" font-size="12">Customs &amp; Duties</text>
<text class="tt" x="28" y="70" font-size="19">Six Checks To Resolve Before Apparel Ships</text>
<rect class="card" x="22" y="82" width="676" height="246" rx="10"/>
<rect class="hdr" x="22" y="82" width="676" height="42" rx="10"/>
<rect class="hdr" x="22" y="104" width="676" height="20"/>
<text class="th" x="32" y="104" font-size="12">Check</text>
<text class="th" x="232" y="104" font-size="12">What it decides</text>
<text class="th" x="492" y="104" font-size="12">When to do it</text>
<rect class="row" x="22" y="124" width="676" height="34"/>
<text class="tdb" x="32" y="145" font-size="12">Tariff line and rate</text>
<text class="td" x="232" y="145" font-size="12">How much duty you pay</text>
<text class="td" x="492" y="145" font-size="12">Before pricing</text>
<line class="ln" x1="22" y1="158" x2="698" y2="158"/>
<rect class="row2" x="22" y="158" width="676" height="34"/>
<text class="tdb" x="32" y="179" font-size="12">Origin and certification</text>
<text class="td" x="232" y="179" font-size="12">Zero duty or general rate</text>
<text class="td" x="492" y="179" font-size="12">Before shipping</text>
<line class="ln" x1="22" y1="192" x2="698" y2="192"/>
<rect class="row" x="22" y="192" width="676" height="34"/>
<text class="tdb" x="32" y="213" font-size="12">Sector registry status</text>
<text class="td" x="232" y="213" font-size="12">Whether it can be cleared</text>
<text class="td" x="492" y="213" font-size="12">Before goods move</text>
<line class="ln" x1="22" y1="226" x2="698" y2="226"/>
<rect class="row2" x="22" y="226" width="676" height="34"/>
<text class="tdb" x="32" y="247" font-size="12">NOM-004 sewn label</text>
<text class="td" x="232" y="247" font-size="12">Whether it can be sold</text>
<text class="td" x="492" y="247" font-size="12">At production</text>
<line class="ln" x1="22" y1="260" x2="698" y2="260"/>
<rect class="row" x="22" y="260" width="676" height="34"/>
<text class="tdb" x="32" y="281" font-size="12">Fiber composition</text>
<text class="td" x="232" y="281" font-size="12">Percentages, descending</text>
<text class="td" x="492" y="281" font-size="12">On the label</text>
<line class="ln" x1="22" y1="294" x2="698" y2="294"/>
<rect class="row2" x="22" y="294" width="676" height="34"/>
<text class="tdb" x="32" y="315" font-size="12">Responsible party</text>
<text class="td" x="232" y="315" font-size="12">Name and tax registration</text>
<text class="td" x="492" y="315" font-size="12">On the label</text>
<text class="ts" x="28" y="354" font-size="10">BringGo Ship · bringgoship.com</text>
</svg>