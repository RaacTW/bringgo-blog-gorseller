<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img"><title>El Flujo De Una Devolución Transfronteriza</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.bg{fill:#ffffff}.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.hdr{fill:#0F6E56}.row{fill:#f5f8f7}.row2{fill:#ffffff}.ln{stroke:#dbe6e1;stroke-width:1}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}
.th{fill:#ffffff;font-weight:bold}.td{fill:#22332f}.tdb{fill:#0F6E56;font-weight:bold}
.pill{fill:#E1F5EE}.tp{fill:#0F6E56;font-weight:bold}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1614}.card{fill:#16211e;stroke:#2c3a35}
.hdr{fill:#12876A}.row{fill:#1d2b27}.row2{fill:#16211e}.ln{stroke:#2c3a35}
.tt{fill:#d7f2e6}.ts{fill:#8fa79d}
.th{fill:#ffffff}.td{fill:#cfe0d9}.tdb{fill:#6fe0b0}
.pill{fill:#123a2e}.tp{fill:#6fe0b0}}
</style>
<rect class="bg" width="720" height="368"/>
<rect class="pill" x="28" y="20" width="241" height="24" rx="12"/>
<text class="tp" x="41" y="36" font-size="12">Devoluciones y Logística Inversa</text>
<text class="tt" x="28" y="70" font-size="19">El Flujo De Una Devolución Transfronteriza</text>
<rect class="card" x="22" y="82" width="676" height="246" rx="10"/>
<rect class="hdr" x="22" y="82" width="676" height="42" rx="10"/>
<rect class="hdr" x="22" y="104" width="676" height="20"/>
<text class="th" x="32" y="104" font-size="12">Etapa</text>
<text class="th" x="222" y="104" font-size="12">Qué ocurre</text>
<text class="th" x="476" y="104" font-size="12">Dato o costo</text>
<rect class="row" x="22" y="124" width="676" height="34"/>
<text class="tdb" x="32" y="145" font-size="12">1. Aviso de devolución</text>
<text class="td" x="222" y="145" font-size="12">El cliente abre la solicitud</text>
<text class="td" x="476" y="145" font-size="12">En FBM respondes en 24 horas</text>
<line class="ln" x1="22" y1="158" x2="698" y2="158"/>
<rect class="row2" x="22" y="158" width="676" height="34"/>
<text class="tdb" x="32" y="179" font-size="12">2. Recolección en México</text>
<text class="td" x="222" y="179" font-size="12">Paquetería nacional recoge</text>
<text class="td" x="476" y="179" font-size="12">Tarifa local, sin cruce</text>
<line class="ln" x1="22" y1="192" x2="698" y2="192"/>
<rect class="row" x="22" y="192" width="676" height="34"/>
<text class="tdb" x="32" y="213" font-size="12">3. Consolidación</text>
<text class="td" x="222" y="213" font-size="12">Se agrupan en el almacén</text>
<text class="td" x="476" y="213" font-size="12">Almacenaje por unidad</text>
<line class="ln" x1="22" y1="226" x2="698" y2="226"/>
<rect class="row2" x="22" y="226" width="676" height="34"/>
<text class="tdb" x="32" y="247" font-size="12">4. Reventa</text>
<text class="td" x="222" y="247" font-size="12">El producto bueno se revende</text>
<text class="td" x="476" y="247" font-size="12">Sin volver a importar</text>
<line class="ln" x1="22" y1="260" x2="698" y2="260"/>
<rect class="row" x="22" y="260" width="676" height="34"/>
<text class="tdb" x="32" y="281" font-size="12">5. Re-importación</text>
<text class="td" x="222" y="281" font-size="12">Solo si conviene el lote</text>
<text class="td" x="476" y="281" font-size="12">Entrada formal o informal</text>
<line class="ln" x1="22" y1="294" x2="698" y2="294"/>
<rect class="row2" x="22" y="294" width="676" height="34"/>
<text class="tdb" x="32" y="315" font-size="12">6. Impuestos al reentrar</text>
<text class="td" x="222" y="315" font-size="12">Se comercializa de nuevo</text>
<text class="td" x="476" y="315" font-size="12">IVA de importación 16%</text>
<text class="ts" x="28" y="354" font-size="10">BringGo Ship · bringgoship.com</text>
</svg>