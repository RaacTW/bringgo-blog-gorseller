<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img"><title>Türk menşeli üründe maliyet yığını</title><style>
text{font-family:Arial,Helvetica,sans-serif}
.bg{fill:#ffffff}.card{fill:#ffffff;stroke:#e4ebe7;stroke-width:1.5}
.mut{fill:#eef1f0}.row{fill:#f5f8f7}.pill{fill:#E1F5EE}
.g{fill:#12876A}.g2{fill:#1f9d5f}
.tt{fill:#0F3D33;font-weight:bold}.ts{fill:#5b6b66}.tl{fill:#22332f}
.tw{fill:#ffffff;font-weight:bold}.tb{fill:#12876A;font-weight:bold}
.ln{stroke:#dbe6e1;stroke-width:1.5}
</style><rect class="bg" width="720" height="300"/><rect x="24" y="20" width="340" height="36" rx="6" class="row"/>
<text x="38" y="43" class="tl" font-size="12">Ürün bedeli</text>
<rect x="24" y="60" width="340" height="36" rx="6" class="row"/>
<text x="38" y="83" class="tl" font-size="12">Uluslararası taşıma ve sigorta</text>
<rect x="24" y="100" width="340" height="36" rx="6" class="g"/>
<text x="38" y="123" class="tw" font-size="12">Gümrük vergisi</text>
<rect x="24" y="140" width="340" height="36" rx="6" class="g"/>
<text x="38" y="163" class="tw" font-size="12">KDV, gümrük değeri üzerinden</text>
<rect x="24" y="180" width="340" height="36" rx="6" class="row"/>
<text x="38" y="203" class="tl" font-size="12">İşlem ve müşavirlik ücretleri</text>
<rect x="24" y="220" width="340" height="36" rx="6" class="row"/>
<text x="38" y="243" class="tl" font-size="12">İç taşıma</text>

<line x1="378" y1="100" x2="404" y2="100" stroke="#12876A" stroke-width="2"/>
<line x1="404" y1="100" x2="404" y2="176" stroke="#12876A" stroke-width="2"/>
<line x1="378" y1="176" x2="404" y2="176" stroke="#12876A" stroke-width="2"/>
<text x="420" y="128" class="tt" font-size="13">Muafiyet varsayımı</text>
<text x="420" y="148" class="tt" font-size="13">bu iki katmanı siler</text>
<text x="420" y="170" class="ts" font-size="12">Türk menşeinde silinmez.</text>

<text x="24" y="284" class="tl" font-size="13">Küçük sepet tutarında bu iki katman, kârlılığı belirler.</text>
</svg>